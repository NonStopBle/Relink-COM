[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relink"
version = "0.1.0"
description = "ReLink -- lightweight ROS-like pub/sub protocol over UDP (Python binding)"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
rlcore = "relink.cli.rlcore:main"
rltopic = "relink.cli.rl_topic:main"
relink-relay = "relink.cli.relay:main"

[tool.setuptools.packages.find]
include = ["relink*"]
